<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETERNAL</title>
<meta name="theme-color" content="#050505">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='24' fill='%23050505'/%3E%3Ccircle cx='50' cy='50' r='30' fill='none' stroke='%23fff' stroke-width='8'/%3E%3Ccircle cx='50' cy='50' r='11' fill='%23ff0000'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bar" aria-hidden="true"></div>
<div class="glow" aria-hidden="true"></div>
<canvas id="net" aria-hidden="true"></canvas>

<div class="app">
  <aside class="side">
    <section class="card profile reveal" style="--i:0">
      <div class="cover" id="cover"></div>
      <div class="p-body">
        <div class="avatar" id="avatar"></div>
        <div class="p-head"><h1 id="nome"></h1><span class="pill" id="status" hidden><i></i><b id="statusTxt"></b></span></div>
        <p class="handle" id="arroba"></p>
        <p class="bio" id="bio"></p>
        <nav class="socials" id="socials" aria-label="Redes sociais"></nav>
      </div>
    </section>
    <section class="card stats reveal" style="--i:1" aria-label="Resumo">
      <div><b id="nLinks">0</b><span>links</span></div>
      <div><b id="nRedes">0</b><span>redes</span></div>
    </section>
  </aside>

  <main class="main">
    <header class="toolbar reveal" style="--i:2">
      <div class="ttl"><h2>Meus links</h2><span id="shown"></span></div>
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Buscar…" autocomplete="off" spellcheck="false" aria-label="Buscar link">
        <kbd>/</kbd>
      </label>
      <div class="seg" role="group" aria-label="Modo de exibição">
        <button type="button" data-v="grid" aria-label="Grade" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></button>
        <button type="button" data-v="list" aria-label="Lista" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
      </div>
    </header>

    <a class="card featured reveal" id="featured" style="--i:3" target="_blank" rel="noopener noreferrer"></a>

    <section class="links grid" id="links" aria-live="polite"></section>
    <footer class="foot" id="foot"></footer>
  </main>
</div>

<script src="script.js"></script>
</body>
</html>
